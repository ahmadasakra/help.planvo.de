{% extends "base.html" %}

{# Inject portal layout styles into <head> on every page.
   All selectors are scoped to body:has(.planvo-portal) so they only
   activate on the homepage and are safe with navigation.instant SPA routing. #}
{% block styles %}
  {{ super() }}
  <style>
    /* === Planvo Portal: Head-Injection — nur aktiv wenn .planvo-portal im DOM === */

    /* Sidebars ausblenden */
    body:has(.planvo-portal) .md-sidebar,
    body:has(.planvo-portal) .md-sidebar--primary,
    body:has(.planvo-portal) .md-sidebar--secondary {
      display: none !important;
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden !important;
    }

    /* Grid + max-width aufheben, volle Breite */
    body:has(.planvo-portal) .md-main__inner {
      display: block !important;
      max-width: none !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    body:has(.planvo-portal) .md-content {
      display: block !important;
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    body:has(.planvo-portal) .md-content__inner {
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    /* Tabs, Banner, Footer, Edit-Buttons */
    body:has(.planvo-portal) .md-tabs,
    body:has(.planvo-portal) .md-banner,
    body:has(.planvo-portal) .md-footer,
    body:has(.planvo-portal) .md-content__button {
      display: none !important;
    }

    /* Hell-Modus Hintergrund */
    body:has(.planvo-portal) .md-main__inner {
      background: #f6f7ff !important;
    }

    /* Dunkel-Modus Hintergrund */
    body[data-md-color-scheme="slate"]:has(.planvo-portal) .md-main__inner {
      background: #0f1117 !important;
    }

    /* Portal-Titel: Material .md-typeset h1 Overrides verhindern (FOUC-Schutz) */
    body:has(.planvo-portal) .md-typeset h1 {
      margin-top: 0 !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
    }

    body:has(.planvo-portal) .planvo-portal__title {
      margin: 0 0 1.75rem !important;
      font-size: clamp(1.85rem, 4vw, 2.35rem) !important;
      font-weight: 700 !important;
      color: #111827 !important;
      -webkit-text-fill-color: #111827 !important;
    }

    body[data-md-color-scheme="slate"]:has(.planvo-portal) .planvo-portal__title {
      color: #f1f0ff !important;
      -webkit-text-fill-color: #f1f0ff !important;
    }
  </style>
{% endblock %}
