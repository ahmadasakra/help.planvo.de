site_name: Planvo Hilfe & Dokumentation
site_url: https://help.planvo.de
site_description: Offizielle Hilfe-Dokumentation für Planvo - Ihre digitale Business-Lösung
site_author: Planvo GmbH

# Repository
repo_url: https://github.com/IHR-USERNAME/help.planvo.de
repo_name: help.planvo.de
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 Planvo GmbH - Alle Rechte vorbehalten

# Theme Configuration
theme:
  name: material
  language: de
  
  # Custom Colors (Planvo Branding)
  palette:
    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Zu dunklem Modus wechseln
    
    # Dark Mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Zu hellem Modus wechseln
  
  # Features - GitHub-Style Navigation
  features:
    - navigation.instant        # Schnelles Laden ohne Reload
    - navigation.tracking       # URL aktualisiert sich beim Scrollen
    - navigation.tabs           # Hauptnavigation als Tabs
    - navigation.tabs.sticky    # Tabs bleiben beim Scrollen sichtbar
    - navigation.sections       # Sections in der Sidebar
    - navigation.expand         # Sidebar automatisch expandiert
    - navigation.indexes        # Index-Seiten für Sections
    - navigation.path           # Breadcrumb-Navigation (wie GitHub)
    - navigation.top            # "Zurück nach oben" Button
    - search.suggest            # Suchvorschläge
    - search.highlight          # Suchergebnisse hervorheben
    - search.share              # Suche teilen
    - toc.follow                # TOC folgt beim Scrollen (wie "In diesem Artikel")
    - content.code.copy         # Code kopieren Button
    - content.code.annotate     # Code-Annotationen
    - content.tabs.link         # Tabs verlinken
  
  # Icons
  icon:
    repo: fontawesome/brands/github
    logo: material/help-circle
  
  # Custom CSS
  extra_css:
    - assets/extra.css

# Plugins
plugins:
  - search:
      lang: 
        - de
        - en
      separator: '[\s\-\.]+'
  - swagger-ui-tag

# Markdown Extensions
markdown_extensions:
  - admonition              # Callout-Boxen
  - pymdownx.details        # Collapsible Callouts
  - pymdownx.superfences    # Code-Blöcke
  - pymdownx.highlight:     # Syntax-Highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite   # Inline Code-Highlighting
  - pymdownx.snippets       # Code-Snippets einbinden
  - pymdownx.tabbed:        # Tabs
      alternate_style: true
  - pymdownx.emoji:         # Emojis
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list               # HTML-Attribute
  - md_in_html              # Markdown in HTML
  - def_list                # Definitions-Listen
  - footnotes               # Fußnoten
  - tables                  # Tabellen
  - toc:                    # Table of Contents
      permalink: true
      permalink_title: Link zu diesem Abschnitt
      toc_depth: 3

# Extra
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.planvo.de
      name: Planvo Website
    - icon: fontawesome/solid/envelope
      link: mailto:support@planvo.de
      name: Support E-Mail
  
  # Analytics (optional - später hinzufügen)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

# Navigation Structure - MVP Phase 1
nav:
  - Startseite: index.md
  
  - Erste Schritte:
    - erste-schritte/index.md
    - Anmeldung: erste-schritte/anmeldung.md
    - Dashboard-Übersicht: erste-schritte/dashboard.md
  
  - Web-Version:
    - web/index.md
    - Zeiterfassung: web/zeiterfassung.md
    - Projektmanagement: web/projekte.md
    - Schichtplanung: web/schichten.md
  
  - Mobile App:
    - mobile/index.md
    - App installieren: mobile/installation.md
    - Zeiterfassung Mobile: mobile/zeiterfassung.md
    - Offline-Modus: mobile/offline-modus.md
  
  - API & Integrationen:
    - api/index.md
    - API Keys verwalten: api/api-keys.md
    - Schnellstart-Guide: api/quickstart.md
    - API-Referenz: api/reference.md
    - API Playground (Swagger): api/swagger.md
    - Code-Beispiele: api/examples.md
  
  - Hilfe:
    - FAQ: hilfe/faq.md
    - Kontakt & Support: hilfe/kontakt.md


