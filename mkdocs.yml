site_name: Planvo Hilfe & Dokumentation
site_url: https://help.planvo.de
site_description: Offizielle Hilfe für Planvo – Handwerk & KMU. Zeiterfassung, Einsatzplanung, Abwesenheiten, Projekte und Rechnungswesen.
site_author: Planvo GmbH

# Repository
repo_url: https://github.com/ahmadasakra/help.planvo.de
repo_name: help.planvo.de
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 Planvo GmbH — <a href="https://www.planvo.de">planvo.de</a>

# Theme Configuration
theme:
  name: material
  language: de

  logo: assets/logo.svg
  favicon: assets/favicon.svg

  # Planvo Markenfarben (CSS: docs/assets/extra.css → primary/accent "custom")
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Zu dunklem Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Zu hellem Modus wechseln

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  extra_css:
    - assets/extra.css

  extra_javascript:
    - javascript/extra.js

# Plugins
plugins:
  - search:
      lang:
        - de
        - en
      separator: '[\s\-\.]+'
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: de
      fallback_to_build_date: true
  - swagger-ui-tag

# Markdown Extensions
markdown_extensions:
  - admonition              # Callout-Boxen
  - pymdownx.details        # Collapsible Callouts
  - pymdownx.superfences    # Code-Blöcke
  - pymdownx.highlight:     # Syntax-Highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite   # Inline Code-Highlighting
  - pymdownx.snippets       # Code-Snippets einbinden
  - pymdownx.tabbed:        # Tabs
      alternate_style: true
  - pymdownx.emoji:         # Emojis
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list               # HTML-Attribute
  - md_in_html              # Markdown in HTML
  - def_list                # Definitions-Listen
  - footnotes               # Fußnoten
  - tables                  # Tabellen
  - toc:                    # Table of Contents
      permalink: true
      permalink_title: Link zu diesem Abschnitt
      toc_depth: 3

# Extra
extra:
  generator: false

  announce:
    text: "Neu — Hilfe für Handwerk & KMU mit Tarif-Hinweisen und aktualisierten Anleitungen."
    link: https://help.planvo.de/erste-schritte/

  social:
    - icon: fontawesome/solid/globe
      link: https://www.planvo.de
      name: Planvo Website
    - icon: fontawesome/solid/envelope
      link: mailto:support@planvo.de
      name: Support E-Mail
    - icon: fontawesome/solid/circle-play
      link: https://demo.planvo.de
      name: Demo

  metadata:
    og:type: website
    og:site_name: Planvo Hilfe
    twitter:card: summary_large_image

# Navigation Structure - MVP Phase 1
nav:
  - Startseite: index.md
  
  - Erste Schritte:
    - erste-schritte/index.md
    - Anmeldung: erste-schritte/anmeldung.md
    - Dashboard-Übersicht: erste-schritte/dashboard.md
  
  - Web-Version:
    - web/index.md
    - Zeiterfassung: web/zeiterfassung.md
    - Auswertung: web/auswertung.md
    - Projektmanagement: web/projekte.md
    - Berichte: web/berichte.md
    - Schichtpläne: web/schichten.md
    - Rechnungen & Angebote: web/rechnungen.md
    - Kundenverwaltung: web/kunden.md
    - Aufgabenmanagement: web/aufgaben.md
    - Service-Termine: web/service-termine.md
    - Abwesenheiten: web/urlaub.md
    - Plantafel: web/plantafel.md
    - Dokumentenmanagement: web/dokumente.md
  
  - Mobile App:
    - mobile/index.md
    - App installieren: mobile/installation.md
    - Zeiterfassung Mobile: mobile/zeiterfassung.md
    - Offline-Modus: mobile/offline-modus.md
  
  - API & Integrationen:
    - api/index.md
    - API Keys verwalten: api/api-keys.md
    - Schnellstart-Guide: api/quickstart.md
    - API-Referenz: api/reference.md
    - API Playground (Swagger): api/swagger.md
    - Code-Beispiele: api/examples.md
  
  - Hilfe:
    - FAQ: hilfe/faq.md
    - Kontakt & Support: hilfe/kontakt.md


